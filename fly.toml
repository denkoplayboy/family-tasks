# Развёртывание на Fly.io: см. README → «Вариант Б»
app = "nash-dom-family"
primary_region = "fra"

[build]

[env]
  DATA_DIR = "/data"
  APP_TZ = "Asia/Jerusalem"

[[mounts]]
  source = "nash_dom_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
