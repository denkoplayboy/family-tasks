# fly.toml app configuration file generated for family-tasks on 2026-11-13T16:29:17Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'family-tasks'
primary_region = 'ams'

[build]
[env]
  APP_TZ = 'Asia/Jerusalem'
  DATA_DIR = '/data'

[[mounts]]
  source = 'nash_dom_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
